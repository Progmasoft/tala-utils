name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Test on Linux, with sanitizers
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BSD Make and Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bmake clang llvm
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: bmake AR=llvm-ar SANITIZE=-fsanitize=address,undefined test

  macos:
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BSD Make
        run: brew install bmake
      - name: Test
        run: bmake test

  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The profile of Progmasoft Core C Coding Guidelines needs clang-format 23.
      - name: Format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bmake
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install clang-format==23.1.5
          bmake format CLANG_FORMAT="$RUNNER_TEMP/format/bin/clang-format"
